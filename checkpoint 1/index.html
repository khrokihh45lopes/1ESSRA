<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pré-Cadastro de Ingressos - Rock in Rio</title>
        <!-- Importação do CSS Externo -->
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>

        <div class="container">
            <h2>Intenção de Compra - Rock in Rio</h2>

            <div class="campo-container">
                <label for="campoNome">Nome Completo: *</label>
                <input type="text" id="campoNome"
                    placeholder="Digite seu nome completo">
            </div>

            <div class="campo-container">
                <label for="campoCpf">CPF: *</label>
                <input type="text" id="campoCpf" placeholder="000.000.000-00"
                    maxlength="14">
            </div>

            <div class="campo-container">
                <label for="campoEmail">E-mail: *</label>
                <input type="email" id="campoEmail"
                    placeholder="seuemail@exemplo.com">
            </div>

            <div class="campo-container">
                <label for="campoCelular">Celular / WhatsApp (Opcional):</label>
                <input type="text" id="campoCelular"
                    placeholder="(00) 00000-0000" maxlength="15">
            </div>

            <!-- Substitua o bloco do select por este: -->
            <div class="campo-container">
                <label for="campoArtista">Selecione ou Pesquise a Atração
                    Desejada: *</label>
                <input type="text" id="campoArtista" list="listaArtistas"
                    placeholder="Digite para buscar um cantor/banda...">
                <datalist id="listaArtistas">
                    <!-- Os <option> serão inseridos dinamicamente pelo JS -->
                </datalist>
            </div>

            <button id="btnCadastrar">Garantir Intenção de Compra</button>

            <div id="painelResultado"></div>
        </div>

        <!-- Importação dos Scripts na Ordem Correta -->
        <script src="js/artistasData.js"></script>
        <script src="js/utils.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
